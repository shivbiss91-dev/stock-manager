    <title>StockVista — Smart Inventory. Strong Business.</title>
    <script>
      // Seamlessly redirect from /docs/ to the main application root preserving hash
      var path = window.location.pathname;
      var newPath = path.replace(/\/docs\/?.*$/, '/');
      window.location.replace(window.location.origin + newPath + window.location.hash);
    </script>
