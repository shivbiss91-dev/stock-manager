<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockVista — Smart Inventory. Strong Business.</title>
    <script>
      (function() {
        var origin = window.location.origin;
        var pathname = window.location.pathname;
        var repoName = '/stock-manager';
        var relative = pathname.startsWith(repoName) ? pathname.slice(repoName.length) : pathname;
        
        // Clean out any leading /docs if someone visited a /docs link
        relative = relative.replace(/^\/docs\/?/, '/');
        
        var targetUrl = origin + repoName + '/';
        if (relative && relative !== '/') {
          var route = relative.startsWith('/') ? relative : '/' + relative;
          targetUrl += '#' + route;
        } else if (window.location.hash) {
          targetUrl += window.location.hash;
        }
        
        window.location.replace(targetUrl);
      })();
    </script>
    <meta http-equiv="refresh" content="0; url=/stock-manager/" />
  </head>
  <body style="background-color: #05060A; color: #F2F4F8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center; padding: 24px; max-width: 480px;">
      <h2 style="color: #FF6B35; font-size: 24px; margin-bottom: 8px;">Launching StockVista...</h2>
      <p style="color: #9AA0AE; font-size: 14px; margin-bottom: 16px;">Redirecting you to the application workspace.</p>
      <a href="/stock-manager/" style="color: #FF6B35; text-decoration: underline; font-size: 14px; font-weight: 600;">Click here if not redirected automatically</a>
    </div>
  </body>
</html>
